<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | Assignment</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- FIX FULLSCREEN + TỈ LỆ + CHỐNG MÀN XANH -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #unity-container {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #000;
    }

    /* giữ đúng tỷ lệ game (16:9 hoặc theo build) */
    #unity-canvas {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 720px;

      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    // Service worker
    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js");
      }
    });

    const canvas = document.getElementById("unity-canvas");
    const loadingBar = document.getElementById("unity-loading-bar");
    const progressBarFull = document.getElementById("unity-progress-bar-full");
    const warningBanner = document.getElementById("unity-warning");

    function unityShowBanner(msg, type) {
      const div = document.createElement('div');
      div.innerHTML = msg;

      if (type === 'error') {
        div.style = "background: red; padding: 10px;";
      } else if (type === 'warning') {
        div.style = "background: yellow; padding: 10px;";
        setTimeout(() => {
          warningBanner.removeChild(div);
        }, 5000);
      }

      warningBanner.appendChild(div);
    }

    // Build paths
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/WebGLBuild.loader.js";

    const config = {
      dataUrl: buildUrl + "/WebGLBuild.data.gz",
      frameworkUrl: buildUrl + "/WebGLBuild.framework.js.gz",
      codeUrl: buildUrl + "/WebGLBuild.wasm.gz",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Assignment",
      productVersion: "0.1",
      showBanner: unityShowBanner,
    };

    // Mobile viewport fix
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);
    }

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(() => {
        loadingBar.style.display = "none";
      }).catch(alert);
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
